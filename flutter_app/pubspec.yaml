
name: mura
description: MURA — personal discipline app (Obsidian & Amber).
publish_to: 'none'
version: 1.4.4+14

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0
  image_picker: ^1.1.2
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0
  # Push notifications: FCM receives, flutter_local_notifications
  # renders foreground messages (background ones use the system tray).
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  shaders:
    - assets/shaders/liquid_transition.frag
