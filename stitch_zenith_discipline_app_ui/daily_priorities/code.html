-md":["Hanken Grotesk"]},fontSize:{"label-md":["14px",{lineHeight:"20px",letterSpacing:"0.05em",fontWeight:"600"}],"headline-md":["24px",{lineHeight:"32px",fontWeight:"600"}],"display-lg":["48px",{lineHeight:"56px",letterSpacing:"-0.02em",fontWeight:"800"}],"body-lg":["18px",{lineHeight:"28px",fontWeight:"400"}],"headline-lg":["32px",{lineHeight:"40px",letterSpacing:"-0.01em",fontWeight:"700"}],"stat-lg":["36px",{lineHeight:"44px",fontWeight:"800"}],"headline-lg-mobile":["28px",{lineHeight:"34px",fontWeight:"700"}],"body-md":["16px",{lineHeight:"24px",fontWeight:"400"}]}}}}</script><style>@layer base{body{overscroll-behavior:none;background-color:#131313;}.pt-safe{padding-top:env(safe-area-inset-top,0px);}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}}</style></head><body class="bg-background text-on-surface font-body-md"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe"><div class="h-16 px-container-padding flex items-center gap-stack-md"><button class="w-11 h-11 flex items-center justify-center text-on-surface" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><h1 class="font-headline-md text-headline-md text-on-surface">Priorities</h1></div></header><main class="min-h-screen pt-16 bg-surface"><div class="flex flex-col w-full h-full relative overflow-hidden bg-background">

</li>
<li class="priority-item relative group flex items-center gap-base p-4 bg-surface-container rounded-xl shadow-sm transition-all duration-300 ease-out transform origin-center border border-white/[0.08]" draggable="true">
<button class="drag-handle touch-none text-on-surface-variant opacity-60 group-active:opacity-100 p-2 -ml-2 cursor-grab active:cursor-grabbing">
<span class="material-symbols-outlined">drag_indicator</span>
</button>
<div class="flex-1 min-w-0 flex flex-col">
<span class="font-label-md text-label-md text-secondary tracking-wider uppercase mb-1">Health</span>
<span class="font-body-lg text-body-lg text-on-surface truncate">45min Zone 2 Cardio</span>
</div>
<button class="complete-btn w-8 h-8 rounded-full bg-surface-container-high border-2 border-outline-variant flex items-center justify-center transition-all duration-300 active:scale-95 group-[.completed]:bg-primary group-[.completed]:border-primary group-[.completed]:text-on-primary">
<span class="material-symbols-outlined text-[18px] opacity-0 transition-opacity duration-300 group-[.completed]:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
</li>
<li class="priority-item relative group flex items-center gap-base p-4 bg-surface-container rounded-xl shadow-sm transition-all duration-300 ease-out transform origin-center border border-white/[0.08]" draggable="true">
<button class="drag-handle touch-none text-on-surface-variant opacity-60 group-active:opacity-100 p-2 -ml-2 cursor-grab active:cursor-grabbing">
<span class="material-symbols-outlined">drag_indicator</span>
</button>
<div class="flex-1 min-w-0 flex flex-col">
<span class="font-label-md text-label-md text-tertiary-container tracking-wider uppercase mb-1">Growth</span>
<span class="font-body-lg text-body-lg text-on-surface truncate">Read 20 pages of Huberman</span>
</div>
<button class="complete-btn w-8 h-8 rounded-full bg-surface-container-high border-2 border-outline-variant flex items-center justify-center transition-all duration-300 active:scale-95 group-[.completed]:bg-primary group-[.completed]:border-primary group-[.completed]:text-on-primary">
<span class="material-symbols-outlined text-[18px] opacity-0 transition-opacity duration-300 group-[.completed]:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
</li>
<li class="priority-item relative group flex items-center gap-base p-4 bg-surface-container rounded-xl shadow-sm transition-all duration-300 ease-out transform origin-center border border-white/[0.08]" draggable="true">
<button class="drag-handle touch-none text-on-surface-variant opacity-60 group-active:opacity-100 p-2 -ml-2 cursor-grab active:cursor-grabbing">
<span class="material-symbols-outlined">drag_indicator</span>
</button>
<div class="flex-1 min-w-0 flex flex-col">
<span class="font-label-md text-label-md text-error tracking-wider uppercase mb-1">Admin</span>
<span class="font-body-lg text-body-lg text-on-surface truncate">Clear inbox to zero</span>
</div>
<button class="complete-btn w-8 h-8 rounded-full bg-surface-container-high border-2 border-outline-variant flex items-center justify-center transition-all duration-300 active:scale-95 group-[.completed]:bg-primary group-[.completed]:border-primary group-[.completed]:text-on-primary">
<span class="material-symbols-outlined text-[18px] opacity-0 transition-opacity duration-300 group-[.completed]:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</button>

</ul>
</div>
<div class="fixed bottom-0 left-0 right-0 p-container-padding bg-surface/90 backdrop-blur-xl border-t border-white/[0.05] z-10 pb-safe">
<div class="flex items-center justify-between mb-2">
<span class="font-label-md text-label-md text-on-surface-variant">Daily Progress</span>
<span class="font-stat-lg text-[20px] leading-tight font-bold text-primary" id="progress-text">0%</span>
</div>
<div class="w-full h-3 bg-surface-container-highest rounded-full overflow-hidden relative shadow-[inset_0_1px_3px_rgba(0,0,0,0.5)]">
<div class="h-full bg-gradient-to-r from-primary-fixed-dim to-primary rounded-full transition-all duration-500 ease-out w-[0%] relative" id="progress-bar">
<div class="absolute inset-0 bg-white/20 w-full animate-[shimmer_2s_infinite]"></div>
</div>
</div>
</div>
</div>
<style>
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  
  .priority-item.dragging {
    opacity: 0.8;
    transform: scale(1.02);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    z-index: 50;
    border-color: var(--color-primary, #ffc174);
    background-color: #2a2a2a; 
  }
  
  .priority-item.completed {
    opacity: 0.5;
  }
  .priority-item.completed .font-body-lg {
    text-decoration: line-through;
    color: var(--color-on-surface-variant);
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const list = document.getElementById('priority-list');
    let draggedItem = null;

    
    const items = document.querySelectorAll('.priority-item');
    items.forEach(item => {
      
      const handle = item.querySelector('.drag-handle');
      
      
      handle.addEventListener('touchstart', (e) => {
         item.setAttribute('draggable', 'true');
      }, {passive: true});

      handle.addEventListener('touchend', (e) => {
         
      }, {passive: true});


      item.addEventListener('dragstart', function(e) {
        draggedItem = this;
        setTimeout(() => {
          this.classList.add('dragging');
        }, 0);
        e.dataTransfer.effectAllowed = 'move';
        
        const dragIcon = document.createElement('div');
        e.dataTransfer.setDragImage(dragIcon, 0, 0);
      });

      item.addEventListener('dragend', function() {
        this.classList.remove('dragging');
        draggedItem = null;
        updateProgress(); 
      });

      item.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        
        if (this === draggedItem) return;
        
        const bounding = this.getBoundingClientRect();
        const offset = bounding.y + (bounding.height / 2);
        
        if (e.clientY - offset > 0) {
          this.style.transform = 'translateY(-4px)';
          this.nextSibling ? list.insertBefore(draggedItem, this.nextSibling) : list.appendChild(draggedItem);
        } else {
           this.style.transform = 'translateY(4px)';
          list.insertBefore(draggedItem, this);
        }
      });
      
      item.addEventListener('dragleave', function() {
          this.style.transform = '';
      });
      
      item.addEventListener('drop', function() {
          this.style.transform = '';
      });

      
      const btn = item.querySelector('.complete-btn');
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        item.classList.toggle('completed');
        
        if(item.classList.contains('completed')) {
            if ('vibrate' in navigator) navigator.vibrate(50);
            
            const effect = document.createElement('div');
            effect.className = 'absolute inset-0 bg-primary/20 rounded-xl blur-md pointer-events-none transition-opacity duration-500 opacity-100';
            item.appendChild(effect);
            setTimeout(() => { effect.style.opacity = '0'; }, 50);
            setTimeout(() => { effect.remove(); }, 550);
        }
        
        updateProgress();
      });
    });

    function updateProgress() {
      const total = items.length;
      const completed = document.querySelectorAll('.priority-item.completed').length;
      const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
      
      const bar = document.getElementById('progress-bar');
      const text = document.getElementById('progress-text');
      
      bar.style.width = `${percentage}%`;
      
      let currentPercent = parseInt(text.innerText);
      const diff = percentage - currentPercent;
      
      if(diff !== 0) {
          let step = 0;
          const animate = setInterval(() => {
              step++;
              const val = currentPercent + (diff > 0 ? step : -step);
              text.innerText = `${val}%`;
              if(step >= Math.abs(diff)) {
                  clearInterval(animate);
                  text.innerText = `${percentage}%`;
              }
          }, 10);
      }
    }
  });
</script></main></body></html>
