<script>
    // Micro-interactions
    function hapticPulse(element) {
      if (navigator.vibrate) {
        navigator.vibrate(50);
      }
      // Visual pulse
      const ripple = element.querySelector('div[id^="ripple"]');
      if(ripple) {
          ripple.classList.remove('opacity-0');
          setTimeout(() => ripple.classList.add('opacity-0'), 300);
      }
    }

    // Pull to reveal logic simulation (Basic vertical drag detection)
    let startY = 0;
    const quoteContainer = document.getElementById('quote-container');
    const quoteContent = document.getElementById('quote-content');
    const defaultGreeting = quoteContainer.querySelector('div:last-child');

    quoteContainer.addEventListener('touchstart', e => {
        startY = e.touches[0].clientY;
    }, {passive: true});

    quoteContainer.addEventListener('touchmove', e => {
        const currentY = e.touches[0].clientY;
        const diffY = currentY - startY;
        
        if (diffY > 20) { // Dragging down
            quoteContainer.classList.add('h-32');
            quoteContainer.classList.remove('h-16');
            quoteContainer.classList.add('bg-surface-container');
            
            quoteContent.classList.remove('-translate-y-16');
            quoteContent.classList.add('translate-y-0');
            
            defaultGreeting.classList.add('opacity-0');
        }
    }, {passive: true});
    
    // Auto collapse after a few seconds of revealing
    quoteContainer.addEventListener('touchend', e => {
        if(quoteContainer.classList.contains('h-32')) {
            setTimeout(() => {
                quoteContainer.classList.remove('h-32');
                quoteContainer.classList.add('h-16');
                quoteContainer.classList.remove('bg-surface-container');
                
                quoteContent.classList.add('-translate-y-16');
                quoteContent.classList.remove('translate-y-0');
                
                defaultGreeting.classList.remove('opacity-0');
            }, 3000);
        }
    });

  </script>
